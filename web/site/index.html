<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proview QR Menu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="app-icon.svg">
<meta name="theme-color" content="#171c29">
<script>/* Proview Navy: theme + menu position before first paint (shared keys pv.theme / pv.menu) */
(function(){var d=document.documentElement,t='dark',m='side';try{t=localStorage.getItem('pv.theme')==='light'?'light':'dark';m=localStorage.getItem('pv.menu')==='bottom'?'bottom':'side'}catch(e){}
d.setAttribute('data-theme',t);if(m==='bottom')d.classList.add('menu-bottom');
var c=document.querySelector('meta[name=theme-color]');if(c)c.setAttribute('content',t==='light'?'#f2f4f9':'#171c29')})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/pages-menu.js"></script>
<script src="js/pages-editor.js"></script>
<script src="js/pages-ai.js"></script>
<script src="js/pages-setup.js"></script>
<script src="js/pages-operate.js"></script>
<script src="js/auth.js"></script>
<script>PQ.start()</script>
</body>
</html>
